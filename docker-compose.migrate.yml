# 迁移测试专用 compose —— 与生产容器完全隔离
# 用法: docker compose -p tdx-api-migrate -f docker-compose.migrate.yml up -d --build
# 隔离点: container_name / 端口(8081) / 数据卷 / 网络 均独立, 不触碰 8080 上的 tdx-stock-web
services:
  stock-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: tdx-stock-web:${VERSION:-v2.0.0-rc1}
    container_name: tdx-stock-web-rc
    ports:
      - "${HOST_PORT:-8081}:8080"
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - PORT=8080
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 600s
    volumes:
      - tdx-data-rc:/app/data/database
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  tdx-data-rc:
    driver: local
